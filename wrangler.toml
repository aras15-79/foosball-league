name = "foosball-league"
main = "src/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "foosball-league"
database_id = "a5526942-a5f6-42f6-a256-7cba9a33eb67"

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
